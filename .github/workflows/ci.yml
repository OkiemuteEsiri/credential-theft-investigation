name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic example report
        run: python -m src.cli data/synthetic_identity_events.json --output reports/generated-assessment.md
